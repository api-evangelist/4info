  resolution (curl exit 6, status 000). The last Internet Archive capture of the site is
  2023-02-02 and the following capture, 2023-05-28, was a 404. There is no host to wire as a
  Website pointer. The forgeglobal.com/4info_stock/ URL this record was harvested from is a
  third-party secondary-market venue listing, not 4Info's web presence, so it is recorded as
  x-harvest-source-url rather than as a Website pointer (roadmap#56).
