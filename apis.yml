aid: 4info
name: 4Info
description: >-
  4INFO, Inc. was a San Mateo (originally Palo Alto) California advertising-technology company
  founded in 2004 by Pankaj Shah and Zaw Thet. It began as an SMS content and alerting service —
  Nielsen called it the largest business-to-consumer SMS content provider in North America in 2008 —
  then pivoted in 2010 into mobile display advertising with the AdHaven platform, a mobile ad
  server, audience data-management and analytics stack sold to publishers, aggregators and
  national advertisers. Its later product was an identity graph: patented technology
  ("Systems and methods for statistically associating mobile devices to households") that
  statistically resolved mobile devices, set-top boxes and connected TVs back to a single
  household so brands could target and measure across screens. mBlox bought the legacy SMS
  business in 2015, and Cadent acquired the remaining company in January 2020, folding the
  identity and cross-screen targeting technology into Cadent's advanced-TV platform. 4INFO no
  longer operates as an independent company: 4info.com is retained for email only and publishes
  no A or AAAA record, so there is no website, developer portal, API reference or machine-readable
  contract of any kind on any 4Info host, live or archived.
